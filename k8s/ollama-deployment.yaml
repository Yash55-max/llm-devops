apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-deployment
  namespace: llm-serving
  labels:
    app: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      initContainers:
        - name: model-puller
          image: ollama/ollama:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              echo "Starting temporary Ollama server to pull model..."
              ollama serve &
              SERVER_PID=$!
              
              echo "Waiting for server readiness..."
              until ollama list > /dev/null 2>&1; do
                sleep 1
              done
              
              echo "Pulling qwen2.5:0.5b..."
              ollama pull qwen2.5:0.5b
              
              echo "Model downloaded. Shutting down temporary server."
              kill $SERVER_PID
          volumeMounts:
            - name: ollama-storage
              mountPath: /root/.ollama
      containers:
        - name: ollama
          image: ollama/ollama:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 11434
              name: http
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          volumeMounts:
            - name: ollama-storage
              mountPath: /root/.ollama
      volumes:
        - name: ollama-storage
          persistentVolumeClaim:
            claimName: ollama-pvc
